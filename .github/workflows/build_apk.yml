name: Build Polar Travel APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Polar Travel source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android platform files
        run: flutter create --org com.polartravel --project-name polar_travel --platforms=android .

      - name: Configure AndroidManifest (Name, Internet, GPS & TTS)
        run: python3 scripts/configure_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Polar Travel Launcher Icons
        run: dart run flutter_launcher_icons

      - name: Build Release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk PolarTravel-release.apk

      - name: Upload PolarTravel-release.apk
        uses: actions/upload-artifact@v4
        with:
          name: PolarTravel-APK
          path: PolarTravel-release.apk
