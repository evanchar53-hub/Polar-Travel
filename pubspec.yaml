name: polar_travel
description: Polar Travel - Open-source navigation app with Satellite/Hybrid layers, road hazard overlays, community reports, and voice guidance.
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.0.0
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  http: ^1.3.0
  flutter_tts: ^4.2.5
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/polar_travel_icon.png"
  adaptive_icon_background: "#1E40AF"
  adaptive_icon_foreground: "assets/icon/polar_travel_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/polar_travel_icon.png
